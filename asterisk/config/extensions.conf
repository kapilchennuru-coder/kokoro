; Zebl - Asterisk dialplan (test/prototype)
;
; This is the "└── Tell Asterisk to call +1XXXXXXXXXX" step in the
; diagram. Our Python app doesn't dial directly - it tells Asterisk's
; AMI to originate a call INTO this context, which then plays the
; Kokoro-generated audio and routes the call out through the
; voipoffice-endpoint trunk (see pjsip.conf).

[outbound-calls]
; This extension is what AMI's Originate action jumps into once the
; call is answered - it plays the patient's audio file, then hangs up.
; The actual filename is passed in dynamically by our Python script
; (see the AMI Originate call - Variable=AUDIO_FILE=patient_1_voice).
exten => play-reminder,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/${AUDIO_FILE})
 same => n,Hangup()
