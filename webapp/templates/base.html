<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zebl Calling Agent</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #1c2b4a; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: white; text-decoration: none; margin-left: 16px; }
    main { max-width: 960px; margin: 24px auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    .status { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .status.answered { background: #d4edda; color: #155724; }
    .status.no_answer { background: #fff3cd; color: #856404; }
    .status.rejected, .status.failed, .status.error { background: #f8d7da; color: #721c24; }
    .status.not_called { background: #e2e3e5; color: #383d41; }
    .flash { background: #fff3cd; border: 1px solid #ffe08a; padding: 10px; border-radius: 4px; margin-bottom: 16px; }
    button, .btn { background: #1c2b4a; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; text-decoration: none; }
    input[type=text], input[type=password], input[type=file] { padding: 8px; width: 100%; box-sizing: border-box; margin-top: 4px; margin-bottom: 12px; }
    label { font-weight: bold; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <strong>Zebl Calling Agent</strong>
    <div>
      {% if session.get('user_id') %}
        <span>{{ session.get('client_name') }}</span>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('upload') }}">Upload Patients</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% endif %}
    </div>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
